type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: 'Contacts id'
    type: string
    example: '67efc6b1b6124aaaa8fe5f9d'
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+380000000003'
  email:
    description: "Contact's email"
    type: string
    example: 'Nikolai@example.com'
  isFavourite:
    description: "Contact's priority"
    type: boolean
    example: true
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Contact's photo"
    type: string
    example: https://res.cloudinary.com/dqlkqebnq/image/upload/v1743515593/samples/people/boy-snow-hoodie.jpg
