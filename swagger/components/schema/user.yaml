type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's id"
    type: string
    example: '67e43d76ee44fbe76e7760e1'
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email"
    type: string
    example: 'Nikolai@example.com'
  password:
    description: "User's password"
    type: string
    example: '12345678'
